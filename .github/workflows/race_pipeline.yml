name: HKJC Multi-Agent Race Pipeline

on:
  schedule:
    - cron: '0 22 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts and WeasyPrint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libpangocairo-1.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Fetch Agent
        run: python agents/fetch_agent.py

      - name: Run Ranking Agent (Markdown, JSON & PDF)
        run: python agents/ranking_agent.py

      - name: Commit and push updated predictions
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ output/
          git diff --staged --quiet || git commit -m "chore: update HKJC race predictions and PDF report"
          git push
